# nginx site: webscan.stansomatic.local -> WebScan on port 8422
# Install:  sudo cp nginx-webscan.conf /etc/nginx/sites-available/webscan.conf
#           sudo ln -s /etc/nginx/sites-available/webscan.conf /etc/nginx/sites-enabled/
#           sudo nginx -t && sudo systemctl reload nginx
# Author: Glenn Leving
server {
    listen 80;
    listen [::]:80;
    server_name webscan.stansomatic.local;

    location / {
        proxy_pass http://127.0.0.1:8422;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
